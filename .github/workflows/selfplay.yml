name: Omega Chess960 Selfplay

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Self-play duration in minutes"
        required: true
        default: "330"
      nodes:
        description: "Omega nodes per MultiPV search"
        required: true
        default: "15000"
      multipv:
        description: "Candidate moves analysed at each position"
        required: true
        default: "3"
      good_move_cp:
        description: "Maximum centipawn gap from best move allowed into candidate pool"
        required: true
        default: "35"
      book_plies:
        description: "Maximum plies initially forced from the existing Chess960 seed book"
        required: true
        default: "12"
      max_plies:
        description: "Safety cap per game; learning itself has no opening-depth cutoff"
        required: true
        default: "260"
      seed:
        description: "Random seed; 0 = derive from workflow run number"
        required: true
        default: "0"
  push:
    branches:
      - main
    paths:
      - ".github/production-trigger"

permissions:
  contents: write

concurrency:
  group: omega-c960-production
  cancel-in-progress: false

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SEED_BOOK_URL: https://raw.githubusercontent.com/FayE75/NimasBot/main/books/c860/c960_280825_0508.bin
      DURATION_MINUTES: ${{ inputs.duration_minutes || '330' }}
      NODES: ${{ inputs.nodes || '15000' }}
      MULTIPV: ${{ inputs.multipv || '3' }}
      GOOD_MOVE_CP: ${{ inputs.good_move_cp || '35' }}
      BOOK_PLIES: ${{ inputs.book_plies || '12' }}
      MAX_PLIES: ${{ inputs.max_plies || '260' }}
      INPUT_SEED: ${{ inputs.seed || '0' }}

    steps:
      - name: Checkout selfplay repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and validate scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git
          python -m py_compile scripts/*.py

      - name: Clone latest Omega main
        env:
          OMEGA_PAT: ${{ secrets.OMEGA_PAT }}
        run: |
          test -n "$OMEGA_PAT" || { echo "Missing OMEGA_PAT repository secret"; exit 1; }
          git clone --depth 1 --branch main --single-branch \
            "https://x-access-token:${OMEGA_PAT}@github.com/FayE75/Omega.git" Omega
          OMEGA_SHA=$(git -C Omega rev-parse HEAD)
          echo "OMEGA_SHA=$OMEGA_SHA" >> "$GITHUB_ENV"
          echo "Using Omega commit: $OMEGA_SHA"
          git -C Omega log -1 --oneline

      - name: Build optimized Omega
        run: |
          make -C Omega/src -j"$(nproc)" profile-build ARCH=x86-64-avx2 COMP=gcc
          ENGINE=$(find Omega/src -maxdepth 2 -type f -executable -iname 'stockfish*' -print -quit)
          test -n "$ENGINE" || { echo "Built Omega executable not found"; exit 1; }
          cp "$ENGINE" ./omega
          chmod +x ./omega
          ./omega bench >/tmp/omega-bench.txt 2>&1
          tail -20 /tmp/omega-bench.txt

      - name: Fetch current NimasBot Chess960 seed book
        run: |
          mkdir -p seed output learning
          curl --fail --location --retry 3 --retry-delay 3 \
            "$SEED_BOOK_URL" -o seed/c960_seed.bin
          test -s seed/c960_seed.bin
          ls -lh seed/c960_seed.bin
          sha256sum seed/c960_seed.bin

      - name: Resolve run seed
        run: |
          SEED="$INPUT_SEED"
          if [ "$SEED" = "0" ] || [ -z "$SEED" ]; then
            SEED=$((20260929 + GITHUB_RUN_NUMBER))
          fi
          echo "RUN_SEED=$SEED" >> "$GITHUB_ENV"
          echo "Selfplay seed: $SEED"

      - name: Run 5h30 quality-weighted Omega vs Omega Chess960 selfplay
        run: |
          echo "Target selfplay duration: ${DURATION_MINUTES} minutes"
          echo "Search: nodes=${NODES}, MultiPV=${MULTIPV}, allowed_gap=${GOOD_MOVE_CP}cp"
          python scripts/selfplay.py \
            --engine ./omega \
            --engine-id "Omega-${OMEGA_SHA}" \
            --book seed/c960_seed.bin \
            --out-dir output \
            --games 0 \
            --duration-minutes "$DURATION_MINUTES" \
            --nodes "$NODES" \
            --multipv "$MULTIPV" \
            --good-move-cp "$GOOD_MOVE_CP" \
            --book-plies "$BOOK_PLIES" \
            --max-plies "$MAX_PLIES" \
            --seed "$RUN_SEED" \
            --threads 2 \
            --hash-mb 256

      - name: Build cumulative enriched Polyglot book
        run: |
          PRIOR=""
          if [ -s learning/cumulative_updates.json.gz ]; then
            PRIOR="--prior-updates learning/cumulative_updates.json.gz"
          fi
          python scripts/build_book.py \
            --seed-book seed/c960_seed.bin \
            --run-updates output/run_updates.json.gz \
            $PRIOR \
            --cumulative-out output/cumulative_updates.json.gz \
            --enriched-out output/c960_enriched.bin \
            --delta-out output/c960_run_delta.bin \
            --summary output/summary.json
          test -s output/selfplay.pgn
          test -s output/c960_enriched.bin
          gzip -9 -c output/selfplay.pgn > output/selfplay.pgn.gz
          ls -lh output/

      - name: Persist cumulative learning state
        run: |
          mkdir -p learning
          cp output/cumulative_updates.json.gz learning/cumulative_updates.json.gz
          cp output/summary.json learning/latest_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/cumulative_updates.json.gz learning/latest_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cumulative Chess960 selfplay learning [skip ci]"
            git push
          fi

      - name: Upload PGN and enriched books
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-c960-selfplay-${{ github.run_number }}
          path: |
            output/selfplay.pgn
            output/selfplay.pgn.gz
            output/summary.json
            output/run_updates.json.gz
            output/cumulative_updates.json.gz
            output/c960_run_delta.bin
            output/c960_enriched.bin
          if-no-files-found: warn
          retention-days: 30
