name: Omega Chess960 Selfplay

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Self-play duration in minutes"
        required: true
        default: "330"
      tc_base_seconds:
        description: "LTC base clock per side in seconds"
        required: true
        default: "60"
      tc_increment_seconds:
        description: "LTC increment per move in seconds"
        required: true
        default: "0.6"
      multipv:
        description: "Candidate moves analysed at each position"
        required: true
        default: "3"
      good_move_cp:
        description: "Maximum centipawn gap from best move allowed into candidate pool"
        required: true
        default: "35"
      book_plies:
        description: "Opening-book prefix plies before Omega takes over; does NOT cap learned book depth"
        required: true
        default: "12"
      max_plies:
        description: "0 = no artificial ply/depth cap; positive value is emergency safety cap only"
        required: true
        default: "0"
      seed:
        description: "Random seed; 0 = derive from workflow run number"
        required: true
        default: "0"
  push:
    branches:
      - main
    paths:
      - ".github/production-trigger"

permissions:
  contents: write

concurrency:
  group: omega-c960-production
  cancel-in-progress: false

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BASE_BOOK_URL: https://raw.githubusercontent.com/FayE75/NimasBot/main/books/c860/c960_280825_0508.bin
      DURATION_MINUTES: ${{ inputs.duration_minutes || '330' }}
      TC_BASE_SECONDS: ${{ inputs.tc_base_seconds || '60' }}
      TC_INCREMENT_SECONDS: ${{ inputs.tc_increment_seconds || '0.6' }}
      MULTIPV: ${{ inputs.multipv || '3' }}
      GOOD_MOVE_CP: ${{ inputs.good_move_cp || '35' }}
      BOOK_PLIES: ${{ inputs.book_plies || '12' }}
      MAX_PLIES: ${{ inputs.max_plies || '0' }}
      INPUT_SEED: ${{ inputs.seed || '0' }}

    steps:
      - name: Checkout selfplay repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and validate scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git
          python -m py_compile scripts/*.py

      - name: Clone latest Omega main
        env:
          OMEGA_PAT: ${{ secrets.OMEGA_PAT }}
        run: |
          test -n "$OMEGA_PAT" || { echo "Missing OMEGA_PAT repository secret"; exit 1; }
          git clone --depth 1 --branch main --single-branch \
            "https://x-access-token:${OMEGA_PAT}@github.com/FayE75/Omega.git" Omega
          OMEGA_SHA=$(git -C Omega rev-parse HEAD)
          echo "OMEGA_SHA=$OMEGA_SHA" >> "$GITHUB_ENV"
          echo "Using Omega commit: $OMEGA_SHA"
          git -C Omega log -1 --oneline

      - name: Build optimized Omega
        run: |
          make -C Omega/src -j"$(nproc)" profile-build ARCH=x86-64-avx2 COMP=gcc
          ENGINE=$(find Omega/src -maxdepth 2 -type f -executable -iname 'stockfish*' -print -quit)
          test -n "$ENGINE" || { echo "Built Omega executable not found"; exit 1; }
          cp "$ENGINE" ./omega
          chmod +x ./omega
          ./omega bench >/tmp/omega-bench.txt 2>&1
          tail -20 /tmp/omega-bench.txt

      - name: Fetch original NimasBot Chess960 base book
        run: |
          mkdir -p seed output learning
          curl --fail --location --retry 3 --retry-delay 3 \
            "$BASE_BOOK_URL" -o seed/c960_base.bin
          test -s seed/c960_base.bin
          echo "Original Nimas base book:"
          ls -lh seed/c960_base.bin
          sha256sum seed/c960_base.bin

      - name: Materialize recursively enriched active book
        run: |
          if [ -s learning/cumulative_updates.json.gz ]; then
            python scripts/materialize_active_book.py \
              --seed-book seed/c960_base.bin \
              --updates learning/cumulative_updates.json.gz \
              --out seed/c960_active.bin
            echo "Using Nimas base + all previous selfplay learning"
          else
            cp seed/c960_base.bin seed/c960_active.bin
            echo "First generation: using original Nimas book"
          fi
          test -s seed/c960_active.bin
          ls -lh seed/c960_active.bin
          sha256sum seed/c960_active.bin

      - name: Resolve run seed
        run: |
          SEED="$INPUT_SEED"
          if [ "$SEED" = "0" ] || [ -z "$SEED" ]; then
            SEED=$((20260929 + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT * 100000))
          fi
          echo "RUN_SEED=$SEED" >> "$GITHUB_ENV"
          echo "Selfplay seed: $SEED"

      - name: Run 5h30 Fishtest-LTC Omega Chess960 selfplay
        run: |
          echo "Target selfplay duration: ${DURATION_MINUTES} minutes"
          echo "Time control: ${TC_BASE_SECONDS}+${TC_INCREMENT_SECONDS} per side"
          echo "MultiPV=${MULTIPV}; candidate gap=${GOOD_MOVE_CP}cp"
          echo "Active-book prefix cap: ${BOOK_PLIES} plies"
          echo "Learned book depth cap: none (MAX_PLIES=${MAX_PLIES}; 0 means unlimited)"
          python -u scripts/selfplay.py \
            --engine ./omega \
            --engine-id "Omega-${OMEGA_SHA}" \
            --book seed/c960_active.bin \
            --out-dir output \
            --games 0 \
            --duration-minutes "$DURATION_MINUTES" \
            --tc-base-seconds "$TC_BASE_SECONDS" \
            --tc-increment-seconds "$TC_INCREMENT_SECONDS" \
            --multipv "$MULTIPV" \
            --good-move-cp "$GOOD_MOVE_CP" \
            --book-plies "$BOOK_PLIES" \
            --max-plies "$MAX_PLIES" \
            --seed "$RUN_SEED" \
            --threads 1 \
            --hash-mb 64

      - name: Filter PGN with strict win-draw-loss learning policy
        run: |
          test -s output/selfplay.pgn
          python scripts/filter_pgn_learning.py \
            --pgn output/selfplay.pgn \
            --out output/run_updates_strict.json.gz
          test -s output/run_updates_strict.json.gz
          echo "Strict policy: loser moves excluded; draw <=10cp; winner <=20cp; no book-depth cutoff"

      - name: Build next cumulative enriched Polyglot book
        run: |
          PRIOR=""
          if [ -s learning/cumulative_updates.json.gz ]; then
            PRIOR="--prior-updates learning/cumulative_updates.json.gz"
          fi
          python scripts/build_book.py \
            --seed-book seed/c960_base.bin \
            --run-updates output/run_updates_strict.json.gz \
            $PRIOR \
            --cumulative-out output/cumulative_updates.json.gz \
            --enriched-out output/c960_enriched.bin \
            --delta-out output/c960_run_delta.bin \
            --summary output/summary.json
          test -s output/c960_enriched.bin
          gzip -9 -c output/selfplay.pgn > output/selfplay.pgn.gz
          ls -lh output/

      - name: Persist cumulative learning state for the next run
        run: |
          mkdir -p learning
          cp output/cumulative_updates.json.gz learning/cumulative_updates.json.gz
          cp output/summary.json learning/latest_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/cumulative_updates.json.gz learning/latest_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cumulative Chess960 selfplay learning [skip ci]"
            git push
          fi

      - name: Publish latest upgraded Chess960 book to repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/c960_enriched.bin output/c960_enriched_latest.bin
          cp output/summary.json output/latest_summary.json
          if gh release view book-latest >/dev/null 2>&1; then
            gh release upload book-latest \
              output/c960_enriched_latest.bin \
              output/latest_summary.json \
              output/selfplay.pgn.gz \
              --clobber
          else
            gh release create book-latest \
              output/c960_enriched_latest.bin \
              output/latest_summary.json \
              output/selfplay.pgn.gz \
              --title "Latest recursively enriched Chess960 book" \
              --notes "Automatically updated from the NimasBot base book plus cumulative Omega self-play at Fishtest-style LTC 60+0.6. Self-play uses a short opening prefix only; learned book depth is uncapped. Losing-side moves are excluded, draws require <=10 cp gap, and winning-side moves require <=20 cp gap."
          fi

      - name: Upload PGN and recursively enriched book
        uses: actions/upload-artifact@v4
        with:
          name: omega-c960-selfplay-${{ github.run_number }}
          path: |
            output/selfplay.pgn
            output/selfplay.pgn.gz
            output/summary.json
            output/run_updates.json.gz
            output/run_updates_strict.json.gz
            output/cumulative_updates.json.gz
            output/c960_run_delta.bin
            output/c960_enriched.bin
          if-no-files-found: error
          retention-days: 30
